name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh quest catalog
        run: python tools/merge_quest_catalog.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Prepare build
        run: python tools/prepare_build.py
      - name: Apply account sync integration
        run: python tools/apply_account_sync.py
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OSRSQuestNavigator --add-data "data/quests.json;data" --add-data "data/routes.json;data" src/app.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OSRSQuestNavigator.exe")) { throw "EXE was not created" }
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build RuneLite bridge JAR
        working-directory: runelite-bridge
        shell: pwsh
        run: gradle build --no-daemon
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OSRSQuestNavigator-Windows
          path: dist/OSRSQuestNavigator.exe
      - name: Upload RuneLite bridge
        uses: actions/upload-artifact@v4
        with:
          name: OSRSQuestNavigator-RuneLite-Bridge
          path: runelite-bridge/build/libs/*.jar
