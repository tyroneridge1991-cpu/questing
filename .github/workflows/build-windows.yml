name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OSRSQuestNavigator --add-data "data/quests.json;data" src/app.py
      - name: Verify bundled data
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OSRSQuestNavigator.exe")) { throw "EXE was not created" }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OSRSQuestNavigator-Windows
          path: dist/OSRSQuestNavigator.exe
